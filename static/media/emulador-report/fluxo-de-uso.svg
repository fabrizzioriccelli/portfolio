<text x="1032" y="176" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14161B">E-mail</text>
<text x="1032" y="202" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#5D6270">resumo com até 4</text>
<text x="1032" y="221" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#5D6270">destaques · .eml</text>
