<text x="48" y="305" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Desfazer e Refazer em todos os passos · a edição fica guardada no navegador até salvar (Recuperar a edição) · a mesma sequência no PF e no PJ</text>
