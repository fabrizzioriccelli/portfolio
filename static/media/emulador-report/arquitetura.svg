<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="t d">
<title id="t">Arquitetura técnica</title>
<desc id="d">Componentes reais: tudo roda no navegador, sem servidor; o Node.js só monta e testa.</desc>
