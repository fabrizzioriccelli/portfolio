<title id="t">Rendimento relativo e CUSUM de C-V07</title>
<desc id="d">A razão entre o rendimento de C-V07 e a mediana dos pares cai de cerca de 0,95 para 0,81 a partir de janeiro de 2026; o CUSUM passa do limiar 5 em fevereiro de 2026.</desc>
