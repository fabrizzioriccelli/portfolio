<title id="t">Decomposição LMDI do custo de combustível</title>
<desc id="d">Para três veículos da EMP-C, a diferença de custo é separada em efeito atividade, intensidade e preço. C-V01 custa mais por rodar mais; C-V03 paga mais caro e consome mais; C-V07 piorou o consumo.</desc>
