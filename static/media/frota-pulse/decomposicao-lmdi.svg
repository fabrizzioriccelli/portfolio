<text x="24.0" y="52.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Os três efeitos somam exatamente a diferença. EMP-C, dados sintéticos.</text>
